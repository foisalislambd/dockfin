# name: OpenSearch
# documentation: https://opensearch.org/docs/latest/install-and-configure/install-opensearch/docker/
# slogan: Open-source search and analytics suite with OpenSearch Dashboards.
# category: search
# tags: opensearch,elasticsearch,search,analytics,dashboards
# logo: svgs/opensearch.svg
# port: 5601
services:
  opensearch:
    image: opensearchproject/opensearch:2.19.1
    environment:
      - cluster.name=opensearch-cluster
      - node.name=opensearch-node1
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:9200/_cluster/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s

  frontend:
    image: opensearchproject/opensearch-dashboards:2.19.1
    environment:
      - SERVICE_URL_OPENSEARCHDASHBOARDS
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    depends_on:
      opensearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:5601/api/status || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
