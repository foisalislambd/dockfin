# name: OWASP Dependency-Track
# documentation: https://docs.dependencytrack.org/getting-started/deploy-docker/
# slogan: OWASP continuous SBOM analysis platform for software supply-chain security.
# category: security
# tags: dependency-track,owasp,sbom,security,vulnerabilities,supply-chain
# logo: svgs/dependency-track.svg
# port: 8080
services:
  dtrack-apiserver:
    image: dependencytrack/apiserver:4.13.1
    environment:
      - ALPINE_DATABASE_MODE=external
      - ALPINE_DATABASE_URL=jdbc:postgresql://postgresql:5432/${POSTGRES_DB:-dtrack}
      - ALPINE_DATABASE_DRIVER=org.postgresql.Driver
      - ALPINE_DATABASE_USERNAME=${SERVICE_USER_POSTGRES}
      - ALPINE_DATABASE_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - ALPINE_DATABASE_POOL_ENABLED=true
      - ALPINE_DATABASE_POOL_MAX_SIZE=20
    volumes:
      - dtrack-data:/data
    depends_on:
      postgresql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/health"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 90s

  dtrack-frontend:
    image: dependencytrack/frontend:4.13.1
    environment:
      - SERVICE_URL_DTRACKFRONTEND
      - API_BASE_URL=${SERVICE_URL_DTRACKFRONTEND}
    depends_on:
      - dtrack-apiserver
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 10

  postgresql:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${SERVICE_USER_POSTGRES}
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - POSTGRES_DB=${POSTGRES_DB:-dtrack}
    volumes:
      - dtrack-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
