# name: OWASP DefectDojo
# documentation: https://documentation.defectdojo.com/getting_started/installation/docker-compose/
# slogan: OWASP security vulnerability management and aggregation platform.
# category: security
# tags: defectdojo,owasp,security,vulnerabilities,appsec
# logo: svgs/defectdojo.svg
# port: 8080
services:
  defectdojo-django:
    image: defectdojo/defectdojo-django:2.43.2-alpine
    environment:
      - SERVICE_URL_DEFECTDOJODJANGO
      - DD_DATABASE_URL=postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgresql:5432/${POSTGRES_DB:-defectdojo}
      - DD_CELERY_BROKER_URL=redis://redis:6379/0
      - DD_SECRET_KEY=${SERVICE_PASSWORD_SECRET}
      - DD_CREDENTIAL_AES_256_KEY=${SERVICE_PASSWORD_AES}
      - DD_ADMIN_USER=${SERVICE_USER_ADMIN}
      - DD_ADMIN_PASSWORD=${SERVICE_PASSWORD_ADMIN}
      - DD_ADMIN_MAIL=${DEFECTDOJO_ADMIN_MAIL:-admin@example.com}
      - DD_ALLOWED_HOSTS=*
      - DD_CSRF_TRUSTED_ORIGINS=${SERVICE_URL_DEFECTDOJODJANGO}
      - DD_UWSGI_MODE=http
      - DD_UWSGI_ENDPOINT=0.0.0.0:8080
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  postgresql:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${SERVICE_USER_POSTGRES}
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - POSTGRES_DB=${POSTGRES_DB:-defectdojo}
    volumes:
      - defectdojo-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    volumes:
      - defectdojo-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
