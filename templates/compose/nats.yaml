# name: NATS
# documentation: https://docs.nats.io/running-a-nats-service/nats_docker
# slogan: High-performance messaging system with JetStream persistence.
# category: messaging
# tags: nats,jetstream,messaging,pubsub,queue
# logo: svgs/nats.svg
# port: 8222
services:
  nats:
    image: nats:2.11.1-alpine
    command: ["--jetstream", "--store_dir=/data", "--http_port=8222"]
    environment:
      - SERVICE_URL_NATS
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
