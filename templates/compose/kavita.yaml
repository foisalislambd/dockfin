# name: Kavita
# documentation: https://wiki.kavitareader.com/installation/docker/
# slogan: Self-hosted reading server for manga, comics, and ebooks.
# category: media
# tags: kavita,comics,manga,ebooks,reader,library
# logo: svgs/kavita.svg
# port: 5000
services:
  kavita:
    image: jvmilazz0/kavita:0.8.6
    environment:
      - SERVICE_URL_KAVITA
      - TZ=${TZ:-UTC}
    volumes:
      - kavita-config:/kavita/config
      - kavita-data:/manga
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5000/api/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s
