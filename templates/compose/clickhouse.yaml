# name: ClickHouse
# documentation: https://clickhouse.com/docs/en/install#docker
# slogan: High-performance columnar OLAP database for analytics and observability.
# category: database
# tags: clickhouse,olap,analytics,database,columnar
# logo: svgs/clickhouse.svg
# port: 8123
services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.5.6-alpine
    environment:
      - SERVICE_URL_CLICKHOUSE
      - CLICKHOUSE_DB=${CLICKHOUSE_DB:-default}
      - CLICKHOUSE_USER=${SERVICE_USER_CLICKHOUSE}
      - CLICKHOUSE_PASSWORD=${SERVICE_PASSWORD_CLICKHOUSE}
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 10
