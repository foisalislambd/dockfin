services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dockfin
      POSTGRES_PASSWORD: dockfin
      POSTGRES_DB: dockfin
    ports:
      - "5432:5432"
    volumes:
      - dockfin-pg-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dockfin"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  dockfin-pg-dev:
