services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dockfin
      POSTGRES_PASSWORD: dockfin
      POSTGRES_DB: dockfin
    ports:
      - "5432:5432"
    volumes:
      - dockfin-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dockfin"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    profiles: ["redis"]

  # Single image: API + Vite dashboard
  dockfin:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.api
    env_file:
      - ../../.env
    environment:
      DOCKFIN_DATABASE_URL: postgres://dockfin:dockfin@postgres:5432/dockfin?sslmode=disable
      DOCKFIN_HTTP_ADDR: ":8000"
      DOCKFIN_WEB_DIR: /app/web
      DOCKFIN_DIR: /host/dockfin
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - dockfin-data:/data
      # Auto-update drives docker compose on the host.
      - /var/run/docker.sock:/var/run/docker.sock
      - /data/dockfin:/host/dockfin

volumes:
  dockfin-pg:
  dockfin-data:
