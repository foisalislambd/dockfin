components:
    schemas:
        Error:
            properties:
                error:
                    type: string
            required:
                - error
            type: object
    securitySchemes:
        bearerAuth:
            scheme: bearer
            type: http
        cookieAuth:
            in: cookie
            name: dockfin_session
            type: apiKey
info:
    description: 'Self-hosted PaaS control plane. This document is generated from the live router, so every path here is a route the server registers. Authenticated routes accept a session cookie or a bearer API token. Configured rate limits per client IP: 600 requests/minute globally, 30 auth attempts per 15 minutes, 120 webhook calls/minute, and 600 sentinel ingests/minute. Set DOCKFIN_RATE_LIMIT_PER_MINUTE, DOCKFIN_AUTH_RATE_LIMIT_PER_15M, or DOCKFIN_WEBHOOK_RATE_LIMIT_PER_MINUTE to override. Zero disables a bucket. DOCKFIN_RATE_LIMIT_STORE=postgres shares the budget across replicas; the default is memory. /health is exempt. /metrics is exempt and public unless DOCKFIN_METRICS_TOKEN is set.'
    title: Dockfin API
    version: dev
openapi: 3.1.0
