name: Release

# Push to main reads VERSION.md.
# Release only when that X.Y.Z is higher than the latest vX.Y.Z tag.
# Same or lower → no tag, no GitHub Release, no image publish.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  actions: write

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.ver.outputs.should_release }}
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      sha: ${{ steps.ver.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Release only when VERSION.md is higher
        id: ver
        run: |
          set -euo pipefail
          git fetch --tags --force

          SHA="$(git rev-parse HEAD)"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

          skip() {
            echo "$1"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          }

          if [[ ! -f VERSION.md ]]; then
            echo "VERSION.md is missing" >&2
            exit 1
          fi
          VER="$(grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' VERSION.md | head -n1 || true)"
          if [[ -z "${VER}" ]]; then
            echo "VERSION.md has no X.Y.Z line" >&2
            exit 1
          fi

          LATEST="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1 || true)"
          LATEST="${LATEST#v}"
          if [[ -n "${LATEST}" ]]; then
            LOWEST="$(printf '%s\n%s\n' "${VER}" "${LATEST}" | sort -V | head -n1)"
            if [[ "${VER}" == "${LATEST}" ]]; then
              skip "VERSION.md is ${VER}, same as latest tag — no release"
            fi
            if [[ "${LOWEST}" == "${VER}" ]]; then
              skip "VERSION.md is ${VER}, lower than latest tag v${LATEST} — no release"
            fi
          fi

          TAG="v${VER}"
          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            skip "Tag ${TAG} already exists — no release"
          fi

          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Will release ${TAG} (previous ${LATEST:-none}, sha=${SHA})"

  verify:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - run: go test ./...
      - name: Build with release version
        run: |
          VER="${{ needs.prepare.outputs.version }}"
          go build -ldflags="-X github.com/dockfin/dockfin/internal/version.Version=${VER}" -o /tmp/dockfin ./cmd/dockfin
          /tmp/dockfin version | tee /tmp/ver.out
          grep -Fq "${VER}" /tmp/ver.out
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - working-directory: apps/web
        run: |
          npm ci
          npm run build

  # Single image → GHCR + Docker Hub (same X.Y.Z). Tag/Release after push.
  docker:
    needs: [prepare, verify]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Image names
        id: meta_name
        run: |
          owner_lc="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          hub_user="${{ secrets.DOCKERHUB_USERNAME }}"
          if [[ -z "${hub_user}" ]]; then
            echo "DOCKERHUB_USERNAME secret is required" >&2
            exit 1
          fi
          echo "ghcr=${{ env.REGISTRY }}/${owner_lc}/dockfin" >> "$GITHUB_OUTPUT"
          echo "hub=${hub_user}/dockfin" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ steps.meta_name.outputs.ghcr }}
            ${{ steps.meta_name.outputs.hub }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.prepare.outputs.version }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
          cache-from: type=gha,scope=release-dockfin
          cache-to: type=gha,mode=max,scope=release-dockfin,ignore-error=true

  tag-and-release:
    needs: [prepare, verify, docker]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and push tag
        run: |
          set -euo pipefail
          VER="${{ needs.prepare.outputs.version }}"
          TAG="${{ needs.prepare.outputs.tag }}"
          git fetch --tags --force
          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Dockfin ${VER}"
          git push origin "${TAG}"
          echo "Pushed ${TAG}"
      - name: Build release notes
        run: |
          VER="${{ needs.prepare.outputs.version }}"
          owner_lc="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          hub_user="${{ secrets.DOCKERHUB_USERNAME }}"
          {
            echo "## Dockfin ${VER}"
            echo
            echo "GitHub Release and Docker tags use the **same version**: \`${VER}\`"
            echo
            echo "### Docker (API + dashboard in one image)"
            echo
            echo "**Docker Hub**"
            echo "- \`${hub_user}/dockfin:${VER}\`"
            echo "- \`${hub_user}/dockfin:latest\`"
            echo
            echo "**GitHub Container Registry**"
            echo "- \`ghcr.io/${owner_lc}/dockfin:${VER}\`"
            echo "- \`ghcr.io/${owner_lc}/dockfin:latest\`"
            echo
            echo "Dashboard and API share port 8000 (map host \`80:8000\` if desired)."
            echo
            if [[ -f CHANGELOG.md ]]; then
              awk -v ver="${VER}" '
                $0 ~ "^## \\[" ver "\\]" {p=1; next}
                p && /^## \[/ {exit}
                p {print}
              ' CHANGELOG.md
            fi
          } > /tmp/notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.version }}
          body_path: /tmp/notes.md
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
