name: Website

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # One Pages deployment at a time. Overlapping main deploys were left
  # deployment_queued until GitHub returned "Deployment failed, try again later."
  group: website-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
      - name: Verify the static build
        run: |
          set -eu
          grep -qx 'dockfin.foisal.org' dist/CNAME
          test -s dist/index.html
          test -s dist/og.jpg
          test -s dist/robots.txt
          test -s dist/sitemap-index.xml
          grep -q 'rel="canonical" href="https://dockfin.foisal.org/"' dist/index.html
          grep -q 'https://dockfin.foisal.org/og.jpg' dist/index.html
          grep -q 'SoftwareApplication' dist/index.html
          grep -q 'curl -fsSL https://raw.githubusercontent.com/foisalislambd/dockfin/main/scripts/install.sh | sudo bash' dist/index.html
          grep -q 'Sitemap: https://dockfin.foisal.org/sitemap-index.xml' dist/robots.txt
          if grep -RInE -e 'trusted by' -e 'testimonial' -e 'customers love' dist --include='*.html'; then
            echo 'Landing page includes invented social proof.' >&2
            exit 1
          fi
      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
          error_count: 36
