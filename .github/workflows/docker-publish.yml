name: Docker publish (manual)

# Prefer Release workflow. Manual rebuild → GHCR + Docker Hub.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image version tag (must match a release, e.g. 1.0.0)"
        required: true
        type: string

permissions:
  contents: read
  packages: write
  actions: write

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Normalize version
        id: ver
        run: |
          V="${{ inputs.version }}"
          V="${V#v}"
          if ! [[ "${V}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version must be X.Y.Z (got ${{ inputs.version }})" >&2
            exit 1
          fi
          echo "version=${V}" >> "$GITHUB_OUTPUT"
          echo "tag=v${V}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ver.outputs.tag }}

      - name: Image names
        id: meta_name
        run: |
          owner_lc="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          hub_user="${{ secrets.DOCKERHUB_USERNAME }}"
          if [[ -z "${hub_user}" ]]; then
            echo "DOCKERHUB_USERNAME secret is required" >&2
            exit 1
          fi
          echo "ghcr=${{ env.REGISTRY }}/${owner_lc}/dockfin" >> "$GITHUB_OUTPUT"
          echo "hub=${hub_user}/dockfin" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.api
          push: true
          tags: |
            ${{ steps.meta_name.outputs.ghcr }}:${{ steps.ver.outputs.version }}
            ${{ steps.meta_name.outputs.ghcr }}:latest
            ${{ steps.meta_name.outputs.hub }}:${{ steps.ver.outputs.version }}
            ${{ steps.meta_name.outputs.hub }}:latest
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
          cache-from: type=gha,scope=manual-dockfin
          cache-to: type=gha,mode=max,scope=manual-dockfin,ignore-error=true
