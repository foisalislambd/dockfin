name: Docker publish (manual)

# Prefer Release workflow (tag vX.Y.Z). This is a manual rebuild escape hatch.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image version tag (must match a release, e.g. 1.0.0)"
        required: true
        type: string

permissions:
  contents: read
  packages: write
  actions: write

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: goolify
            file: deploy/docker/Dockerfile.api
          - name: goolify-web
            file: deploy/docker/Dockerfile.web
    steps:
      - name: Normalize version
        id: ver
        run: |
          V="${{ inputs.version }}"
          V="${V#v}"
          if ! [[ "${V}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version must be X.Y.Z (got ${{ inputs.version }})" >&2
            exit 1
          fi
          echo "version=${V}" >> "$GITHUB_OUTPUT"
          echo "tag=v${V}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ver.outputs.tag }}

      - name: Image name
        id: meta_name
        run: |
          owner_lc="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=${{ env.REGISTRY }}/${owner_lc}/${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: |
            ${{ steps.meta_name.outputs.image }}:${{ steps.ver.outputs.version }}
            ${{ steps.meta_name.outputs.image }}:latest
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
          cache-from: type=gha,scope=manual-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=manual-${{ matrix.name }},ignore-error=true
